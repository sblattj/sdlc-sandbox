name: approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review ${{ inputs.pr }} --approve -b "actions probe" -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
